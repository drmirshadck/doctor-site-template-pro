# TEST ONLY: Pro own calendar on arshees.com/samples/dotcom-calendar-pro-test/
# Deployed by Cloudflare Workers Builds from branch own-calendar with:  npx wrangler deploy -c wrangler.test.toml  (root /worker)
name = "dotcom-by-arshees-calendar-test-pro"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true          # a deploy never removes values added in the Cloudflare dashboard

[triggers]
crons = ["*/15 * * * *"]   # WhatsApp reminders (24 h + 1 h) and review requests

[vars]
CLINIC_NAME = "Pro Test Clinic"
CLINIC_WHATSAPP = "919000000000"        # clinic's own WhatsApp, shown to patients for questions
DESK_WHATSAPP = ""          # front desk gets "new booking" WhatsApp alerts ("" = none)
REVIEW_URL = ""                         # clinic's Google review link ("" = no review requests)
SITE_URL = "https://arshees.com/samples/dotcom-calendar-pro-test"
ALLOWED_ORIGINS = "https://arshees.com,https://www.arshees.com"
VAPID_SUBJECT = "mailto:support@arshees.com"
WA_ENABLED = "1"                        # needs secret WA_TOKEN; without it, the dashboard offers "Send on WhatsApp" instead
WA_LANG = "en"
WA_PHONE_ID = "1442684148932294"        # DotCom WhatsApp sender (Meta test number for now)
# OWN CALENDAR (no Cal.com): "own". Leave out or "cal" = Cal.com as before.
CALENDAR = "own"
TIMEZONE = "Asia/Kolkata"
RETAIN_DAYS = "365"          # bookings are deleted this many days after the appointment
CHANGE_CUTOFF_HOURS = "2"    # patients can cancel / change time online until this many hours before
# Starting timetable for every doctor (each doctor, or the desk, changes it later in the dashboard). Type slugs = calSlug in config.js.
# A doctor can have their own: "schedule" in their DOCTORS_JSON entry.
SCHEDULE_JSON = '''{"week":{"1":[["10:00","13:00"],["17:00","20:00"]],"2":[["10:00","13:00"],["17:00","20:00"]],"3":[["10:00","13:00"],["17:00","20:00"]],"4":[["10:00","13:00"],["17:00","20:00"]],"5":[["10:00","13:00"],["17:00","20:00"]],"6":[["10:00","13:00"]],"0":[]},"gap":10,"notice":3,"ahead":30,"types":{"online-video-consultation":{"name":"New consultation","length":30,"confirm":true},"review-consultation":{"name":"Review consultation","length":20,"confirm":true}}}'''
# Emails (patient + doctor) via Zoho ZeptoMail, sender name = CLINIC_NAME, secret ZEPTO_TOKEN
EMAIL_PROVIDER = "zeptomail"
EMAIL_FROM = "yourbooking@arshees.com"
ZEPTO_HOST = "cpaas.zoho.com"
# One entry per doctor. types: calSlug -> name, fee, kind (new/review). whatsapp: doctor's alerts number. email: doctor's own email (booking emails).
DOCTORS_JSON = '''[{"id":"anu","name":"Dr. Anu Test","whatsapp":"971586576586","email":"godigital@arshees.com","roomUrl":"","types":{"online-video-consultation":{"name":"New consultation","fee":500,"kind":"new"},"review-consultation":{"name":"Review consultation","fee":300,"kind":"review"}}},{"id":"ben","name":"Dr. Ben Test","whatsapp":"971586576586","email":"godigital@arshees.com","roomUrl":"","types":{"online-video-consultation":{"name":"New consultation","fee":400,"kind":"new"}}}]'''

[[durable_objects.bindings]]
name = "CALS"
class_name = "Calendar"

[[durable_objects.bindings]]
name = "ROOMS"          # own video: one room per consultation (connection messages only, nothing stored)
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Calendar"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

[[kv_namespaces]]
binding = "PUSH"
id = "e974b2d8206b4c599fc447cba21802bf"

# Secrets (never in this file): CAL_KEYS, DAILY_KEYS, PINS, SESSION_SECRET, CAL_WEBHOOK_SECRET,
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK, WA_TOKEN, and for the own calendar DATA_KEY + ZEPTO_TOKEN (no CAL_KEYS needed)   ->  node make-secrets.mjs sample=1234 desk=5678
